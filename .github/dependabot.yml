# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-patch-days: 3 # pnpm-workspace.yaml has a matching `minimumReleaseAge` setting — keep them in sync
    ignore:
      # `astro check` refuses to run on TypeScript 7.0 and tells us to stay on TypeScript 6.
      # It's deprecated anyway: type-checking Astro files on TypeScript 7.1+ is supposed to work
      # through the experimental @astrojs/ts-content-mapper, so we skip 7.0 only and revisit on 7.1.
      # https://github.com/withastro/astro/tree/main/packages/language-tools/ts-content-mapper#usage
      - dependency-name: "typescript"
        versions: ["7.0.x"]
    groups:
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@biomejs/biome"
          - "typescript"
      website-dependencies:
        patterns:
          - "*astro*"
          - "*cloudfour*"
          - "*fontsource*"
          - "*rehype*"
          - "drizzle-orm"
          - "postgres"
          - "sharp"
          - "shiki"
          - "ua-parser-js"
          - "unist-util-visit"
          - "web-vitals"
      playground-dependencies:
        patterns:
          - "react*"
  - package-ecosystem: "github-actions"
    # Workflow files stored in the default location of `.github/workflows`
    # You don't need to specify `/.github/workflows` for `directory`. You can use `directory: "/"`.
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
