name: Playground

# Disabled on this throwaway investigation branch.
on:
  workflow_dispatch:

jobs:
  test-playground:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browsers
        uses: ./.github/actions/installPlaywright

      - name: Run playground tests
        run: pnpm --filter playground test
