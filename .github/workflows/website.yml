name: Website

on:
  push:

jobs:
  build-and-publish:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build Accented
        run: pnpm --filter accented build

      - name: Check
        run: pnpm --filter website check

      - name: Install Playwright browsers
        uses: ./.github/actions/installPlaywright

      # This has to run before "Build website": the tests start `astro dev`,
      # which deletes the server function the build puts in .netlify/v1/functions,
      # so the deploy would go out without it (and analytics requests would 404).
      # See https://github.com/pomerantsev/accented/issues/614.
      - name: Run end-to-end tests
        run: pnpm --filter website test

      - name: Archive end-to-end test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: website-e2e-results
          path: packages/website/playwright

      - name: Build website
        run: pnpm website:build
        env:
          STAGE: ${{ github.ref != 'refs/heads/main' }}

      # - name: Install lychee
      #   if: github.ref != 'refs/heads/stage'
      #   uses: ./.github/actions/installLychee

      # - name: Check links
      #   if: github.ref != 'refs/heads/stage'
      #   run: ./packages/website/scripts/checkLinks.mjs --local
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.LINK_CHECK_TOKEN }}

      - name: Run database migrations
        if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
        run: |
          SITE_ID=${{ github.ref == 'refs/heads/stage' && vars.NETLIFY_STAGE_SITE_ID || vars.NETLIFY_SITE_ID }}
          pnpm --filter website exec netlify link --id $SITE_ID
          pnpm --filter website db:migrate
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      # main deploys to production; every other branch deploys to the stage site.
      # Tag pushes aren't deployed, and neither are Dependabot branches,
      # since Dependabot runs can't read Actions secrets.
      - name: Deploy website
        if: ${{ startsWith(github.ref, 'refs/heads/') && !startsWith(github.ref, 'refs/heads/dependabot/') }}
        run: pnpm website:deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ github.ref == 'refs/heads/main' && vars.NETLIFY_SITE_ID || vars.NETLIFY_STAGE_SITE_ID }}
